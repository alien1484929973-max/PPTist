name: Release presentation player

on:
  push:
    tags:
      - 'presentation-player-v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:player
      - run: NODE_OPTIONS=--max-old-space-size=1024 npx vue-tsc -p tsconfig.app.json --noEmit
      - run: npm run build:player
      - run: npm run verify:player-package
      - name: Pack
        working-directory: packages/presentation-player
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-player-package
          path: pptist-presentation-player-*.tgz
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/presentation-player
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$version" == *-* ]]; then dist_tag=beta; else dist_tag=latest; fi
          npm publish --tag "$dist_tag" --provenance --access public
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./packages/presentation-player/package.json").version')"
          release_flags=()
          if [[ "$version" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" pptist-presentation-player-*.tgz --generate-notes "${release_flags[@]}"
